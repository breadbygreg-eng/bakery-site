<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the List | Aiara Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-brown: #5d4037;
            --accent-gold: #d4a373;
        }

        body { 
            margin: 0; 
            padding: 0;
            font-family: 'Lato', sans-serif; 
            background: radial-gradient(circle at center, #4e342e 0%, #211512 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width: 100%;
            max-width: 450px; 
            padding: 40px 20px; 
            box-sizing: border-box;
            text-align: center;
        }

        header { margin-bottom: 30px; }
        header h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.8rem; 
            margin: 0;
            font-style: italic;
            color: var(--accent-gold);
        }
        .subtitle {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            margin-top: 5px;
            color: rgba(255,255,255,0.8);
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.98);
            color: #333;
            padding: 35px 25px;
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-top: 4px solid var(--accent-gold);
        }

        .signup-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-top: 0;
            color: var(--primary-brown);
        }

        .signup-card p {
            font-size: 1rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 25px;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
            box-sizing: border-box;
            font-family: 'Lato', sans-serif;
        }

        button {
            width: 100%;
            padding: 18px;
            background: var(--accent-gold);
            color: var(--primary-brown);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            filter: brightness(1.1);
        }

        .footer-link {
            margin-top: 30px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .footer-link:hover {
            color: var(--accent-gold);
        }

        /* Honeypot */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Aiara Bakery</h1>
            <div class="subtitle">Artisan Sourdough • Clarksburg, MD</div>
        </header>

        <main class="signup-card">
            <h2>Get the Weekly Menu</h2>
            <p>Join our list to receive weekly bake dates, fresh sourdough menus, and local pickup details.</p>

            <form action="/subscribe" method="POST">
                <!-- Honeypot -->
                <div class="hidden" aria-hidden="true">
                    <input type="text" name="website_url" tabindex="-1" autocomplete="off">
                </div>

                <input type="email" name="email" placeholder="Enter your email address" required>
                <button type="submit">Join the List</button>
            </form>
        </main>

        <a href="/" class="footer-link">Visit the full website</a>
    </div>
</body>
</html>
